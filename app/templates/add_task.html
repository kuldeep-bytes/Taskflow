{% extends "base.html" %}

{% block title %}
Add Task - TaskFlow
{% endblock %}

{% block content %}

<section class="form-section">

    <div class="container">

        <div class="form-card">

            <h1>Add New Task</h1>

            <p class="form-subtitle">
                Add a task and keep your day organized.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="title">Task Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Enter task description (optional)"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="start_at">Start Date & Time</label>

                    <input
                        type="datetime-local"
                        id="start_at"
                        name="start_at"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="due_at">Due Date & Time</label>

                    <input
                        type="datetime-local"
                        id="due_at"
                        name="due_at"
                        required
                    >
                </div>



                <div class="form-actions">

                    <a href="{{ url_for('main.dashboard') }}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="btn">
                        Add Task
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
