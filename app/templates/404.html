{% extends "base.html" %}

{% block title %}
Page Not Found - TaskFlow
{% endblock %}

{% block content %}

<section class="error-section">

    <div class="container">

        <div class="error-content">

            <h1>404</h1>

            <h2>Oops! Page Not Found</h2>

            <p>
                The page you are looking for doesn't exist
                or may have been moved.
            </p>

            <a href="{{ url_for('main.home') }}" class="btn">
                Go Back Home
            </a>

        </div>

    </div>

</section>

{% endblock %}
