{% extends "base.html" %}

{% block title %}
Edit Task - TaskFlow
{% endblock %}

{% block content %}

<section class="form-section">

    <div class="container">

        <div class="form-card">

            <h1>Edit Task</h1>

            <p class="form-subtitle">
                Update your task details.
            </p>

            <form method="POST">

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ task.title }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                    >{{ task.description or "" }}</textarea>

                </div>

                <div class="form-group">
                    <label for="start_at">Start Date & Time</label>

                    <input
                        type="datetime-local"
                        id="start_at"
                        name="start_at"
                        value="{{ task.start_at.strftime('%Y-%m-%dT%H:%M') if task.start_at else '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="due_at">Due Date & Time</label>

                    <input
                        type="datetime-local"
                        id="due_at"
                        name="due_at"
                        value="{{ task.due_at.strftime('%Y-%m-%dT%H:%M') if task.due_at else '' }}"
                        required
                    >
                </div>



                <div class="form-actions">

                    <a
                        href="{{ url_for('main.tasks') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button type="submit" class="btn">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
