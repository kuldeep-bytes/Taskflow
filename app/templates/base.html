<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <div class="container">
            <a href="{{ url_for('main.home') }}" class="logo navbar-brand">
                <img
                    src="{{ url_for('static', filename='images/taskflow-logo.png') }}"
                    alt="TaskFlow Logo"
                    class="brand-logo"
                >
                TaskFlow
            </a>

            <div class="nav-links">
                <a href="{{ url_for('main.home') }}">Home</a>
                <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a href="{{ url_for('main.tasks') }}">Tasks</a>
            </div>
        </div>
    </nav>


    <main>
        <div class="container">

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="flash-message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}

        </div>

        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 TaskFlow. Built with Flask.</p>
    </footer>
    
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</body>
</html>
